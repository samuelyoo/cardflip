<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF8C42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>동물 카드 짝맞추기 (단일 파일) 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   동물 카드 짝맞추기 - Card Flip Memory Game
   교회 어린이 게임 세션용, TV 디스플레이 최적화
   ========================================================================== */

:root {
  /* 따뜻한 페이퍼 크래프트 팔레트 */
  --cream: #FFF6E5;
  --cream-deep: #FFEDD0;
  --orange: #FF8C42;
  --orange-deep: #F26419;
  --teal: #4ECDC4;
  --teal-deep: #2EB5AC;
  --yellow: #FFD93D;
  --pink: #FF6B9D;
  --green: #6BCB77;
  --purple: #A78BFA;
  --navy: #2D3047;
  --navy-soft: #4A4E69;

  /* 카드 색상 (앞면 배경) */
  --card-1: #FFE5D9;
  --card-2: #D9F2EE;
  --card-3: #FFF4CC;
  --card-4: #FFD6E5;
  --card-5: #E0F5D9;
  --card-6: #E8DFFC;

  /* 그림자 */
  --shadow-sm: 0 2px 8px rgba(45, 48, 71, 0.08);
  --shadow-md: 0 6px 20px rgba(45, 48, 71, 0.12);
  --shadow-lg: 0 12px 40px rgba(45, 48, 71, 0.18);
  --shadow-card: 0 8px 0 rgba(45, 48, 71, 0.12), 0 12px 24px rgba(45, 48, 71, 0.15);
  --shadow-card-hover: 0 12px 0 rgba(45, 48, 71, 0.12), 0 16px 32px rgba(45, 48, 71, 0.2);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* 키보드 포커스 강조 (마우스 클릭 시에는 표시 안 함) */
button:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 3px;
}

.card:focus-visible {
  outline: 4px solid var(--orange);
  outline-offset: 4px;
  border-radius: clamp(14px, 1.6vw, 22px);
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Fredoka', 'Gaegu', sans-serif;
  background-color: var(--cream);
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255, 217, 61, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(78, 205, 196, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255, 107, 157, 0.08) 0%, transparent 50%);
  color: var(--navy);
  user-select: none;
  -webkit-user-select: none;
}

/* ==========================================================================
   레이아웃
   ========================================================================== */

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: clamp(12px, 1.5vh, 20px) clamp(20px, 2vw, 40px);
  gap: clamp(10px, 1.5vh, 18px);
}

/* ==========================================================================
   헤더
   ========================================================================== */

.header {
  display: flex;
  justify-content: center;
  align-items: center;
}

.title {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: clamp(28px, 4vh, 48px);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.4em;
  color: var(--navy);
  text-shadow: 3px 3px 0 var(--yellow);
  transform: rotate(-1deg);
}

.title-paw {
  display: inline-block;
  animation: bounce 2s ease-in-out infinite;
}

.title-paw:last-child {
  animation-delay: 0.5s;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-8px) rotate(5deg); }
}

/* ==========================================================================
   컨트롤 바
   ========================================================================== */

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: clamp(10px, 1.6vw, 20px);
  flex-wrap: wrap;
}

.actions {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.2vw, 14px);
}

/* 난이도 버튼 그룹 */
.difficulty {
  display: flex;
  gap: clamp(6px, 0.8vw, 12px);
  background: white;
  padding: clamp(6px, 0.8vh, 10px);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  border: 3px solid var(--navy);
}

.diff-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: clamp(6px, 0.8vh, 12px) clamp(10px, 1.2vw, 18px);
  background: transparent;
  border: none;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  color: var(--navy-soft);
}

.diff-btn:hover {
  background: var(--cream);
  transform: translateY(-2px);
}

.diff-btn.active {
  background: var(--orange);
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 4px 0 var(--orange-deep);
}

.diff-icon {
  font-size: clamp(20px, 2.4vh, 28px);
  line-height: 1;
}

.diff-label {
  font-size: clamp(14px, 1.8vh, 20px);
  font-weight: 700;
}

.diff-size {
  font-size: clamp(10px, 1.2vh, 13px);
  opacity: 0.8;
  font-weight: 500;
}

/* 통계 */
.stats {
  display: flex;
  gap: clamp(10px, 1.2vw, 18px);
}

.stat {
  display: flex;
  align-items: center;
  gap: clamp(6px, 0.8vw, 12px);
  background: white;
  padding: clamp(6px, 0.9vh, 10px) clamp(10px, 1.2vw, 18px);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  border: 3px solid var(--navy);
  min-width: clamp(86px, 10vw, 140px);
}

.stat-icon {
  font-size: clamp(22px, 2.6vh, 32px);
  line-height: 1;
}

.stat-info {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.stat-label {
  font-size: clamp(11px, 1.3vh, 14px);
  font-weight: 500;
  color: var(--navy-soft);
  letter-spacing: 0.02em;
}

.stat-value {
  font-size: clamp(20px, 2.6vh, 30px);
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}

.stat-best .stat-value {
  color: var(--orange-deep);
}

/* 다시하기 버튼 */
.restart-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: clamp(10px, 1.3vh, 16px) clamp(18px, 2vw, 28px);
  background: var(--teal);
  color: white;
  border: 3px solid var(--navy);
  border-radius: 16px;
  font-family: inherit;
  font-size: clamp(15px, 1.8vh, 20px);
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--teal-deep), var(--shadow-sm);
  transition: all 0.15s ease;
}

.restart-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 var(--teal-deep), var(--shadow-md);
}

.restart-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 var(--teal-deep);
}

/* 옵션 토글 그룹 (호버, 사운드) */
.option-group {
  display: flex;
  gap: clamp(6px, 0.8vw, 10px);
  background: white;
  padding: clamp(4px, 0.6vh, 8px);
  border-radius: 16px;
  border: 3px solid var(--navy);
  box-shadow: var(--shadow-sm);
}

.icon-toggle {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: clamp(6px, 0.8vh, 10px) clamp(10px, 1.2vw, 16px);
  background: transparent;
  color: var(--navy-soft);
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  min-width: clamp(54px, 6vw, 70px);
}

.icon-toggle:hover {
  background: var(--cream);
  transform: translateY(-2px);
}

.icon-toggle.active {
  background: var(--purple);
  color: white;
  box-shadow: 0 4px 0 #8B6FE3;
  transform: translateY(-2px);
}

.icon-toggle-icon {
  font-size: clamp(18px, 2.2vh, 24px);
  line-height: 1;
}

.icon-toggle-label {
  font-size: clamp(10px, 1.2vh, 13px);
  letter-spacing: 0.02em;
}

/* 호버 모드 활성 시 카드 뒷면 색조 변경 (살짝 보라색) */
.app.hover-mode .card:not(.flipped):not(.matched) .card-back {
  background:
    radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 50%),
    linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
}

.app.hover-mode .card:not(.flipped):not(.matched) .card-back::after {
  content: "🖱️";
  position: absolute;
  top: 6%;
  right: 6%;
  font-size: 0.32em;
  background: white;
  border-radius: 999px;
  padding: 0.15em 0.3em;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}

/* ==========================================================================
   게임 영역
   ========================================================================== */

.game-area {
  position: relative;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 0;
  padding: clamp(6px, 1vh, 12px);
}

/* 시작 미리보기 배너 */
.preview-banner {
  position: absolute;
  top: clamp(6px, 1vh, 14px);
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: clamp(8px, 1vh, 12px) clamp(16px, 2vw, 24px);
  background: var(--navy);
  color: white;
  border-radius: 999px;
  font-weight: 700;
  font-size: clamp(14px, 1.8vh, 18px);
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 5;
}

.preview-banner.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.preview-banner-icon {
  font-size: 1.3em;
  line-height: 1;
}

.preview-banner-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.6em;
  height: 1.6em;
  padding: 0 0.4em;
  background: var(--yellow);
  color: var(--navy);
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
  animation: countPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes countPop {
  0% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

.grid {
  display: grid;
  gap: clamp(8px, 1.2vh, 16px);
  width: 100%;
  height: 100%;
  max-width: 1700px;
  align-content: center;
  justify-content: center;
}

/* 난이도별 그리드 — max-width = (cols/rows) × 가용 높이 비율(약 78vh) */
.grid[data-level="tiny"] {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  max-width: min(900px, 104vh);
}

.grid[data-level="easy"] {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  max-width: min(800px, 78vh);
}

.grid[data-level="medium"] {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  max-width: min(1200px, 117vh);
}

.grid[data-level="hard"] {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  max-width: min(900px, 78vh);
}

/* ==========================================================================
   카드
   ========================================================================== */

.card {
  position: relative;
  aspect-ratio: 1 / 1;
  perspective: 1200px;
  cursor: pointer;
  animation: cardEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: scale(0.5) rotate(-15deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card.matched .card-inner {
  animation: matchPulse 0.6s ease-out;
}

@keyframes matchPulse {
  0% { transform: rotateY(180deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.1); }
  100% { transform: rotateY(180deg) scale(1); }
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: clamp(12px, 1.5vw, 20px);
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 4px solid var(--navy);
  box-shadow: var(--shadow-card);
}

/* 카드 뒷면 (보이는 면) */
.card-back {
  background:
    radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 50%),
    linear-gradient(135deg, var(--orange) 0%, var(--pink) 100%);
  font-size: clamp(40px, 8vh, 100px);
  color: white;
  overflow: hidden;
}

.card-back::before {
  content: "";
  position: absolute;
  inset: 8%;
  border: 3px dashed rgba(255, 255, 255, 0.5);
  border-radius: clamp(8px, 1vw, 14px);
}

.card-back-icon {
  position: relative;
  z-index: 1;
  filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.15));
  transition: transform 0.3s ease;
}

.card:hover:not(.flipped):not(.matched) .card-back-icon {
  transform: scale(1.15) rotate(10deg);
}

.card:hover:not(.flipped):not(.matched) .card-face {
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-4px);
}

/* 카드 앞면 (이모지가 보이는 면) */
.card-front {
  transform: rotateY(180deg);
  font-size: clamp(36px, 9vh, 120px);
}

/* 카드 색상 변형 (다양성을 위해) */
.card[data-color="1"] .card-front { background: var(--card-1); }
.card[data-color="2"] .card-front { background: var(--card-2); }
.card[data-color="3"] .card-front { background: var(--card-3); }
.card[data-color="4"] .card-front { background: var(--card-4); }
.card[data-color="5"] .card-front { background: var(--card-5); }
.card[data-color="6"] .card-front { background: var(--card-6); }

/* 매치된 카드 효과 */
.card.matched .card-face {
  border-color: var(--green);
  box-shadow: 0 0 0 4px rgba(107, 203, 119, 0.3), var(--shadow-card);
}

.card.matched {
  cursor: default;
  animation: matchedGlow 2s ease-in-out infinite;
}

@keyframes matchedGlow {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(107, 203, 119, 0)); }
  50% { filter: drop-shadow(0 0 12px rgba(107, 203, 119, 0.5)); }
}

/* ==========================================================================
   승리 모달
   ========================================================================== */

.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: opacity 0.4s ease;
}

.modal.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(45, 48, 71, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal-card {
  position: relative;
  background: white;
  border-radius: 32px;
  padding: clamp(28px, 4vh, 48px) clamp(36px, 5vw, 64px);
  border: 5px solid var(--navy);
  box-shadow: 0 12px 0 var(--navy), 0 20px 60px rgba(0, 0, 0, 0.3);
  text-align: center;
  max-width: 90vw;
  transform: scale(0.7) rotate(-3deg);
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal.show .modal-card {
  transform: scale(1) rotate(0);
}

.win-burst {
  font-size: clamp(60px, 10vh, 100px);
  line-height: 1;
  margin-bottom: 12px;
  animation: burst 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: inline-block;
}

@keyframes burst {
  0% { transform: scale(0) rotate(-180deg); }
  100% { transform: scale(1) rotate(0); }
}

.win-title {
  font-size: clamp(32px, 5vh, 56px);
  font-weight: 700;
  color: var(--orange);
  text-shadow: 3px 3px 0 var(--yellow);
  margin-bottom: 16px;
}

.new-record {
  display: none;
  font-size: clamp(18px, 2.4vh, 24px);
  font-weight: 700;
  color: white;
  background: var(--pink);
  padding: 8px 20px;
  border-radius: 999px;
  margin-bottom: 20px;
  animation: wiggle 0.6s ease infinite alternate;
}

.new-record.show {
  display: inline-block;
}

@keyframes wiggle {
  from { transform: rotate(-3deg); }
  to { transform: rotate(3deg); }
}

.win-stats {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
  font-size: clamp(18px, 2.4vh, 26px);
}

.win-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 10px 20px;
  background: var(--cream);
  border-radius: 14px;
  border: 2px solid var(--navy);
}

.win-stat-label {
  font-weight: 500;
  color: var(--navy-soft);
}

.win-stat-value {
  font-weight: 700;
  font-size: 1.2em;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}

.play-again-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: clamp(12px, 1.6vh, 18px) clamp(28px, 3vw, 40px);
  background: var(--teal);
  color: white;
  border: 4px solid var(--navy);
  border-radius: 18px;
  font-family: inherit;
  font-size: clamp(18px, 2.4vh, 24px);
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--teal-deep);
  transition: all 0.15s ease;
}

.play-again-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 0 var(--teal-deep);
}

.play-again-btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 var(--teal-deep);
}

/* ==========================================================================
   색종이 캔버스
   ========================================================================== */

#confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
}

/* ==========================================================================
   반응형 - 작은 화면에서도 사용 가능
   ========================================================================== */

@media (max-width: 900px) {
  .controls {
    justify-content: center;
  }

  .diff-size {
    display: none;
  }

  .stat {
    min-width: auto;
  }

  .stat-best {
    display: none;
  }

  .icon-toggle-label {
    display: none;
  }
}

@media (max-width: 560px) {
  .stat-pairs {
    display: none;
  }

  .diff-btn {
    padding: clamp(6px, 0.9vh, 10px) clamp(8px, 1.2vw, 12px);
  }

  .diff-label {
    font-size: clamp(12px, 1.5vh, 14px);
  }
}

@media (max-height: 600px) {
  .title {
    font-size: clamp(22px, 3.5vh, 36px);
  }
}

/* 모션 줄이기 환경 설정 존중 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.1s !important;
  }

  .card-inner {
    transition: transform 0.2s ease !important;
  }
}

  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="app">
    <header class="header">
      <h1 class="title">
        <span class="title-paw">🐾</span>
        <span class="title-text">동물 카드 짝맞추기</span>
        <span class="title-paw">🐾</span>
      </h1>
    </header>

    <div class="controls">
      <div class="difficulty">
        <button class="diff-btn" data-level="tiny">
          <span class="diff-icon">🐣</span>
          <span class="diff-label">아주쉬움</span>
          <span class="diff-size">3 × 4</span>
        </button>
        <button class="diff-btn active" data-level="easy">

          <span class="stat-icon">🏆</span>

        <div class="option-group">
          <button class="icon-toggle" id="hoverToggle" aria-pressed="false" title="호버 뒤집기">

            <span class="icon-toggle-label">호버</span>
          </button>
          <button class="icon-toggle" id="soundToggle" aria-pressed="true" title="사운드">
            <span class="icon-toggle-icon" id="soundIcon">🔊</span>
            <span class="icon-toggle-label" id="soundLabel">소리</span>

      <div class="preview-banner" id="previewBanner" aria-live="polite">

    <div class="modal-backdrop"></div>
    <div class="modal-card">

      <div class="new-record" id="newRecord">🏆 신기록 달성!</div>
      <div class="win-stats">
        <div class="win-stat">
          <span class="win-stat-label">⏱️ 걸린 시간</span>
          <span class="win-stat-value" id="finalTime">0:00</span>
        </div>
        <div class="win-stat">
          <span class="win-stat-label">👆 이동 횟수</span>
          <span class="win-stat-value" id="finalMoves">0</span>
        </div>

      <button class="play-again-btn" id="playAgain">
        <span>🎮</span>
        <span>다시 도전하기</span>
      </button>
    </div>
  </div>

  <script>
/* ==========================================================================
   동물 카드 짝맞추기 - 게임 로직
   ========================================================================== */

// ---------- 설정 ----------
const ANIMAL_POOL = [
  '🐶', '🐱', '🦁', '🐯', '🐻', '🐼',
  '🐨', '🐸', '🐵', '🦊', '🐰', '🐮',
  '🐷', '🐔', '🐧', '🦄', '🐙', '🦋'
];

const LEVELS = {
  tiny:   { rows: 3, cols: 4, pairs: 6,  label: '아주쉬움' },
  easy:   { rows: 4, cols: 4, pairs: 8,  label: '쉬움' },
  medium: { rows: 4, cols: 6, pairs: 12, label: '보통' },
  hard:   { rows: 6, cols: 6, pairs: 18, label: '어려움' }
};

const STORAGE_KEY = 'cardflip_best_scores_v1';
const HOVER_FLIP_KEY = 'cardflip_hover_flip_v1';
const SOUND_KEY = 'cardflip_sound_v1';
const PREVIEW_SECONDS = 2;

// ---------- 상태 ----------
const state = {
  level: 'easy',
  cards: [],          // [{ id, content, matched }]
  flippedIndices: [], // 현재 뒤집힌 카드 (최대 2)
  matchedCount: 0,
  moves: 0,
  startTime: null,
  elapsedMs: 0,
  timerInterval: null,
  locked: false,
  gameStarted: false,
  gameOver: false,
  hoverFlip: false,
  soundOn: true,
  previewTimer: null,
  previewInterval: null
};

// ---------- DOM 참조 ----------
const $ = (sel) => document.querySelector(sel);
const elements = {
  grid:        $('#grid'),
  timer:       $('#timer'),
  moves:       $('#moves'),
  best:        $('#best'),
  restart:     $('#restart'),
  diffButtons: document.querySelectorAll('.diff-btn'),
  winModal:    $('#winModal'),
  finalTime:   $('#finalTime'),
  finalMoves:  $('#finalMoves'),
  newRecord:   $('#newRecord'),
  playAgain:   $('#playAgain'),
  confetti:    $('#confetti-canvas'),
  hoverToggle: $('#hoverToggle'),
  soundToggle: $('#soundToggle'),
  soundIcon:   $('#soundIcon'),
  soundLabel:  $('#soundLabel'),
  pairs:       $('#pairs'),
  previewBanner: $('#previewBanner'),
  previewCount:  $('#previewCount'),
  app:         document.querySelector('.app')
};

// ==========================================================================
// 사운드 (Web Audio API - 외부 파일 없이 작동)
// ==========================================================================

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      console.warn('Web Audio API not supported');
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, duration = 0.15, type = 'sine', volume = 0.2, when = 0) {
  if (!state.soundOn) return;
  const ctx = ensureAudio();
  if (!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime + when);
  osc.connect(gain);
  gain.connect(ctx.destination);

  gain.gain.setValueAtTime(0, ctx.currentTime + when);
  gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + when + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + duration);

  osc.start(ctx.currentTime + when);
  osc.stop(ctx.currentTime + when + duration);
}

const sounds = {
  flip: () => playTone(700, 0.08, 'triangle', 0.15),
  match: () => {
    playTone(659, 0.12, 'sine', 0.2, 0);    // E5
    playTone(880, 0.18, 'sine', 0.22, 0.08); // A5
  },
  noMatch: () => {
    playTone(220, 0.18, 'sawtooth', 0.12, 0);
    playTone(180, 0.18, 'sawtooth', 0.1, 0.06);
  },
  win: () => {
    // C-E-G-C 상승 멜로디
    const notes = [523, 659, 784, 1047];
    notes.forEach((n, i) => playTone(n, 0.25, 'triangle', 0.22, i * 0.12));
    // 화음으로 마무리
    setTimeout(() => {
      playTone(523, 0.4, 'sine', 0.15);
      playTone(659, 0.4, 'sine', 0.15);
      playTone(784, 0.4, 'sine', 0.15);
    }, 600);
  },
  click: () => playTone(500, 0.05, 'sine', 0.1)
};

// ==========================================================================
// 색종이 효과
// ==========================================================================

function launchConfetti() {
  const canvas = elements.confetti;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#FF8C42', '#FFD93D', '#4ECDC4', '#FF6B9D', '#6BCB77', '#A78BFA', '#F26419'];
  const particles = [];
  const count = 180;

  for (let i = 0; i < count; i++) {
    particles.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 200,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 15,
      vy: -(Math.random() * 12 + 8),
      size: Math.random() * 10 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * Math.PI * 2,
      rotationSpeed: (Math.random() - 0.5) * 0.3,
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      opacity: 1
    });
  }

  let frameCount = 0;
  function animate() {
    frameCount++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let alive = 0;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;       // 중력
      p.vx *= 0.99;       // 공기 저항
      p.rotation += p.rotationSpeed;

      if (p.y > canvas.height + 50) {
        p.opacity = 0;
      } else if (frameCount > 60) {
        p.opacity = Math.max(0, p.opacity - 0.005);
      }

      if (p.opacity > 0) {
        alive++;
        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    });

    if (alive > 0) {
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  animate();
}

// ==========================================================================
// 카드 데이터
// ==========================================================================

/**
 * 카드 데이터를 생성합니다.
 * 추후 이모지를 이미지로 바꾸려면 content에 이미지 URL을 넣으면 됩니다.
 * 예: { id: 0, content: '/images/dog.png', type: 'image' }
 */
function buildCards(level) {
  const config = LEVELS[level];
  const animals = shuffle([...ANIMAL_POOL]).slice(0, config.pairs);
  const cards = [];
  animals.forEach((animal, i) => {
    cards.push({ id: `${i}-a`, pairId: i, content: animal, matched: false });
    cards.push({ id: `${i}-b`, pairId: i, content: animal, matched: false });
  });
  return shuffle(cards);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==========================================================================
// 렌더링
// ==========================================================================

function renderGrid() {
  elements.grid.innerHTML = '';
  elements.grid.setAttribute('data-level', state.level);

  state.cards.forEach((card, index) => {
    const cardEl = document.createElement('button');
    cardEl.className = 'card';
    cardEl.setAttribute('data-index', index);
    cardEl.setAttribute('data-color', (index % 6) + 1);
    cardEl.setAttribute('aria-label', '카드');
    // 카드 입장 지연을 짧게 (총 카드 수와 무관하게 ~0.5s 내에 마무리)
    const totalCards = state.cards.length;
    const stagger = Math.min(0.03, 0.5 / Math.max(totalCards, 1));
    cardEl.style.animationDelay = `${index * stagger}s`;

    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <span class="card-back-icon">🐾</span>
        </div>
        <div class="card-face card-front">
          <span>${card.content}</span>
        </div>
      </div>
    `;

    cardEl.addEventListener('click', () => handleCardClick(index));
    cardEl.addEventListener('mouseenter', () => {
      if (state.hoverFlip) handleCardClick(index);
    });
    elements.grid.appendChild(cardEl);
  });
}

function updateStats() {
  elements.moves.textContent = state.moves;
  elements.timer.textContent = formatTime(state.elapsedMs);
  const totalPairs = LEVELS[state.level].pairs;
  elements.pairs.textContent = `${state.matchedCount} / ${totalPairs}`;
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ==========================================================================
// 게임 로직
// ==========================================================================

function startGame(level) {
  // 상태 초기화
  stopTimer();
  cancelPreview();
  state.level = level;
  state.cards = buildCards(level);
  state.flippedIndices = [];
  state.matchedCount = 0;
  state.moves = 0;
  state.startTime = null;
  state.elapsedMs = 0;
  state.locked = false;
  state.gameStarted = false;
  state.gameOver = false;

  // 난이도 버튼 활성화
  elements.diffButtons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === level);
  });

  // 최고 기록 표시
  refreshBestScore();

  // 그리드 그리기
  renderGrid();
  updateStats();

  // 모달 닫기
  closeWinModal();

  // 시작 미리보기: 모든 카드 1초간 공개
  previewAllCards();
}

function previewAllCards() {
  state.locked = true;
  const cardEls = elements.grid.querySelectorAll('.card');
  cardEls.forEach(el => el.classList.add('flipped'));

  // 카운트다운 배너 표시
  let remaining = PREVIEW_SECONDS;
  elements.previewCount.textContent = remaining;
  elements.previewBanner.classList.add('show');

  state.previewInterval = setInterval(() => {
    remaining--;
    if (remaining > 0) {
      elements.previewCount.textContent = remaining;
      // 카운트 변화 시 살짝 pop 애니메이션 재시작
      elements.previewCount.style.animation = 'none';
      void elements.previewCount.offsetWidth;
      elements.previewCount.style.animation = '';
    }
  }, 1000);

  state.previewTimer = setTimeout(() => {
    cardEls.forEach(el => {
      if (!el.classList.contains('matched')) {
        el.classList.remove('flipped');
      }
    });
    state.locked = false;
    hidePreviewBanner();
    clearInterval(state.previewInterval);
    state.previewInterval = null;
    state.previewTimer = null;
  }, PREVIEW_SECONDS * 1000);
}

function hidePreviewBanner() {
  elements.previewBanner.classList.remove('show');
}

function cancelPreview() {
  if (state.previewTimer) {
    clearTimeout(state.previewTimer);
    state.previewTimer = null;
  }
  if (state.previewInterval) {
    clearInterval(state.previewInterval);
    state.previewInterval = null;
  }
  hidePreviewBanner();
}

function handleCardClick(index) {
  if (state.gameOver) return;
  // 미리보기 중 클릭하면 즉시 미리보기 종료
  if (state.previewTimer) {
    cancelPreview();
    const allCards = elements.grid.querySelectorAll('.card');
    allCards.forEach(el => {
      if (!el.classList.contains('matched')) el.classList.remove('flipped');
    });
    state.locked = false;
    return;
  }
  if (state.locked) return;
  const card = state.cards[index];
  if (card.matched) return;
  if (state.flippedIndices.includes(index)) return;
  if (state.flippedIndices.length >= 2) return;

  // 첫 클릭 시 타이머 시작
  if (!state.gameStarted) {
    state.gameStarted = true;
    startTimer();
  }

  // 카드 뒤집기
  const cardEl = elements.grid.querySelector(`[data-index="${index}"]`);
  cardEl.classList.add('flipped');
  state.flippedIndices.push(index);
  sounds.flip();

  // 두 장이 뒤집혔으면 매치 검사
  if (state.flippedIndices.length === 2) {
    state.moves++;
    updateStats();
    checkMatch();
  }
}

function checkMatch() {
  const [i1, i2] = state.flippedIndices;
  const c1 = state.cards[i1];
  const c2 = state.cards[i2];
  const el1 = elements.grid.querySelector(`[data-index="${i1}"]`);
  const el2 = elements.grid.querySelector(`[data-index="${i2}"]`);

  if (c1.pairId === c2.pairId) {
    // 매치 성공
    state.locked = true;
    setTimeout(() => {
      c1.matched = true;
      c2.matched = true;
      el1.classList.add('matched');
      el2.classList.add('matched');
      state.matchedCount++;
      state.flippedIndices = [];
      state.locked = false;
      sounds.match();

      if (state.matchedCount === LEVELS[state.level].pairs) {
        endGame();
      }
    }, 300);
  } else {
    // 매치 실패
    state.locked = true;
    setTimeout(() => {
      sounds.noMatch();
    }, 200);
    setTimeout(() => {
      el1.classList.remove('flipped');
      el2.classList.remove('flipped');
      state.flippedIndices = [];
      state.locked = false;
    }, 1000);
  }
}

// ==========================================================================
// 타이머
// ==========================================================================

function startTimer() {
  state.startTime = Date.now();
  state.timerInterval = setInterval(() => {
    state.elapsedMs = Date.now() - state.startTime;
    elements.timer.textContent = formatTime(state.elapsedMs);
  }, 100);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

// ==========================================================================
// 게임 종료
// ==========================================================================

function endGame() {
  stopTimer();
  state.gameOver = true;
  state.elapsedMs = Date.now() - state.startTime;
  updateStats();

  const isNewRecord = saveBestScore(state.level, state.elapsedMs, state.moves);

  // 결과 모달
  elements.finalTime.textContent = formatTime(state.elapsedMs);
  elements.finalMoves.textContent = state.moves;
  elements.newRecord.classList.toggle('show', isNewRecord);

  setTimeout(() => {
    openWinModal();
    sounds.win();
    launchConfetti();
  }, 600);
}

function openWinModal() {
  elements.winModal.classList.add('show');
  elements.winModal.setAttribute('aria-hidden', 'false');
}

function closeWinModal() {
  elements.winModal.classList.remove('show');
  elements.winModal.setAttribute('aria-hidden', 'true');
}

// ==========================================================================
// 최고 기록 저장 (localStorage)
// ==========================================================================

function loadBestScores() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : {};
  } catch (e) {
    return {};
  }
}

function saveBestScore(level, timeMs, moves) {
  const scores = loadBestScores();
  const current = scores[level];
  let isNew = false;

  if (!current || timeMs < current.timeMs ||
      (timeMs === current.timeMs && moves < current.moves)) {
    scores[level] = { timeMs, moves, date: Date.now() };
    isNew = true;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    } catch (e) {
      console.warn('Could not save best score');
    }
  }

  refreshBestScore();
  return isNew;
}

function refreshBestScore() {
  const scores = loadBestScores();
  const best = scores[state.level];
  elements.best.textContent = best ? formatTime(best.timeMs) : '--';
}

// ==========================================================================
// 이벤트 바인딩
// ==========================================================================

elements.diffButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    sounds.click();
    startGame(btn.dataset.level);
  });
});

elements.restart.addEventListener('click', () => {
  sounds.click();
  startGame(state.level);
});

function setHoverFlip(enabled) {
  state.hoverFlip = enabled;
  elements.hoverToggle.classList.toggle('active', enabled);
  elements.hoverToggle.setAttribute('aria-pressed', enabled ? 'true' : 'false');
  elements.app.classList.toggle('hover-mode', enabled);
  try {
    localStorage.setItem(HOVER_FLIP_KEY, enabled ? '1' : '0');
  } catch (e) {}
}

function setSoundOn(enabled) {
  state.soundOn = enabled;
  elements.soundToggle.classList.toggle('active', enabled);
  elements.soundToggle.setAttribute('aria-pressed', enabled ? 'true' : 'false');
  elements.soundIcon.textContent = enabled ? '🔊' : '🔇';
  elements.soundLabel.textContent = enabled ? '소리' : '음소거';
  try {
    localStorage.setItem(SOUND_KEY, enabled ? '1' : '0');
  } catch (e) {}
}

elements.hoverToggle.addEventListener('click', () => {
  sounds.click();
  setHoverFlip(!state.hoverFlip);
});

elements.soundToggle.addEventListener('click', () => {
  // 토글 후 소리 재생 (꺼질 때는 안 남)
  setSoundOn(!state.soundOn);
  if (state.soundOn) sounds.click();
});

// 저장된 설정 불러오기
try {
  setHoverFlip(localStorage.getItem(HOVER_FLIP_KEY) === '1');
} catch (e) {
  setHoverFlip(false);
}
try {
  const saved = localStorage.getItem(SOUND_KEY);
  setSoundOn(saved === null ? true : saved === '1');
} catch (e) {
  setSoundOn(true);
}

elements.playAgain.addEventListener('click', () => {
  sounds.click();
  startGame(state.level);
});

// 모달 배경 클릭으로 닫기
elements.winModal.querySelector('.modal-backdrop').addEventListener('click', () => {
  closeWinModal();
});

// 키보드 단축키
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    startGame(state.level);
  } else if (e.key === '0') {
    startGame('tiny');
  } else if (e.key === '1') {
    startGame('easy');
  } else if (e.key === '2') {
    startGame('medium');
  } else if (e.key === '3') {
    startGame('hard');
  } else if (e.key === 'h' || e.key === 'H') {
    setHoverFlip(!state.hoverFlip);
  } else if (e.key === 'm' || e.key === 'M') {
    setSoundOn(!state.soundOn);
  } else if (e.key === 'Escape') {
    closeWinModal();
  }
});

// 화면 크기 변경 시 색종이 캔버스도 업데이트
window.addEventListener('resize', () => {
  elements.confetti.width = window.innerWidth;
  elements.confetti.height = window.innerHeight;
});

// ==========================================================================
// 게임 시작!
// ==========================================================================

startGame('easy');

  </script>
